<!DOCTYPE html>
<html lang="fr">
<head>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2196f3">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta charset="UTF-8">
  <title>GeoLook PRO</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #333 url("./grungebg.jpeg");
      color: white;
      text-align: center;
    }

    h1 { font-size: 60px; margin: 15px 0; }
    h2 { margin: 10px 0; }

    #controls {
      margin-bottom: 10px;
    }

    #address-input {
      width: 80%;
      max-width: 400px;
      padding: 10px;
      border-radius: 6px;
      border: 2px solid #2196f3;
      text-align: center;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px;
    }

    button {
      background: white;
      border: 1px solid #2196f3;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      min-width: 120px;
    }

    button:hover {
      background: #2196f3;
      color: white;
    }

    #map {
      width: 98%;
      height: 600px;
      margin: 10px auto;
      border: 3px solid #2196f3;
      border-radius: 10px;
    }

    #drone-info {
      max-width: 600px;
      margin: 10px auto;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.8);
      border-left: 5px solid #2196f3;
    }

    .safe { border-left-color: green; }
    .warning { border-left-color: orange; }
    .danger { border-left-color: red; }

  </style>
</head>

<body>

<h1>GeoLook PRO</h1>
<h2>Carte drone + NOTAM + IGN</h2>

<!-- CONTROLS -->
<div id="controls">

  <button id="locate-button">📍 Me localiser</button>

  <br><br>

  <input id="address-input" type="text"
         placeholder="Adresse ou destination">

</div>

<!-- TRANSPORT -->
<div class="buttons">
  <button id="route-button-car">🚗 Voiture</button>
  <button id="route-button-transit">🚌 Transport</button>
  <button id="route-button-bike">🚲 Vélo</button>
  <button id="route-button-walk">🚶 Pied</button>
</div>

<!-- DRONE -->
<div class="buttons">
  <button id="check-drone">🚁 Check drone</button>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- DRONE INFO -->
<div id="drone-info"></div>

<footer>GeoLook PRO – DJI style</footer>

<!-- GOOGLE MAPS (FIX IMPORTANT) -->
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBA4ONxjKbF_2UZoC4zkEoSVLnYbRH944g&libraries=geometry&callback=initMap"
  async defer>
</script>

<script src="script.js"></script>

</body>
</html>
